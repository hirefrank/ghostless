[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostless"
version = "0.1.0"
description = "Measure a local writing corpus and judge AI drafts against that voice."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Frank Harris" }]
keywords = ["writing", "voice", "cli", "agent-skills"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/hirefrank/ghostless"
Repository = "https://github.com/hirefrank/ghostless"

[project.scripts]
ghostless = "ghostless.cli:main"

[project.optional-dependencies]
dev = [
  "coverage==7.13.0",
  "hypothesis==6.131.9",
  "jsonschema==4.23.0",
  "mypy==1.19.0",
  "ruff==0.14.8",
  "types-jsonschema==4.23.0.20241208",
]

[tool.setuptools.packages.find]
where = ["lib"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "RUF", "C90", "S"]
ignore = ["E501", "S101"]
# Dispatchers and report formatters sit in the low 20s. The cap stops a new
# function from growing past that without a noqa and a reason.
mccabe.max-complexity = 22
# Curly quotes and en dashes are prose, not confusable identifiers.
allowed-confusables = ["–", "—", "‘", "’"]

[tool.ruff.lint.per-file-ignores]
# Tests build commands and assert on them. Production subprocess calls are
# noqa'd at the call with a reason.
"tests/**" = ["S603", "S607", "S310", "S311", "S105", "S108"]

[tool.mypy]
python_version = "3.11"
mypy_path = "lib"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
extra_checks = true
