[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostless"
version = "0.1.0"
description = "Measure a local writing corpus and judge AI drafts against that voice."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Frank Harris" }]
keywords = ["writing", "voice", "cli", "agent-skills"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/hirefrank/ghostless"
Repository = "https://github.com/hirefrank/ghostless"

[project.scripts]
ghostless = "ghostless.cli:main"

[tool.setuptools.packages.find]
where = ["lib"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "lib"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
