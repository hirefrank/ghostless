[package]
name = "ghostless-editor"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune.git", rev = "fa07f485dd52d8f66db317460566ef4dc4784821", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "fa07f485dd52d8f66db317460566ef4dc4784821", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Rune needs its patched wgpu-hal for native DX12 adapter selection on Windows.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune.git", rev = "fa07f485dd52d8f66db317460566ef4dc4784821" }

[profile.dev]
debug = "line-tables-only"
