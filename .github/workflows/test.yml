name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff and mypy
        run: python -m pip install --upgrade ruff mypy
      - name: Run ruff
        run: ruff check lib tests
      - name: Run mypy
        run: mypy lib/ghostless

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: bash tests/run.sh
      - name: Check CLI syntax
        run: bash -n bin/ghostless setup
