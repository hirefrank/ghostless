name: Rune editor

on:
  push:
  pull_request:

jobs:
  editor-artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: ghostless-editor
          - os: macos-latest
            binary: ghostless-editor
          - os: windows-latest
            binary: ghostless-editor.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system graphics libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri xvfb
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Select Rust
        run: rustup default 1.99.1
      - name: Install the CLI
        run: python -m pip install .
      - name: Build pinned Rune editor
        run: cargo build --manifest-path editor/Cargo.toml --locked --release
      - name: Exercise the editor session
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python tests/smoke_editor.py
          else
            python tests/smoke_editor.py
          fi
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ghostless-editor-${{ matrix.os }}
          path: editor/target/release/${{ matrix.binary }}
          if-no-files-found: error
