name: Rune editor

on:
  push:
  pull_request:

jobs:
  editor-artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: ghostless-editor
          - os: macos-latest
            binary: ghostless-editor
          - os: windows-latest
            binary: ghostless-editor.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system graphics libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev mesa-vulkan-drivers xvfb
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Select Rust
        run: rustup default 1.99.1
      - name: Lint Rune editor
        run: cargo clippy --manifest-path editor/Cargo.toml --locked -- -D warnings
      - name: Test editor project resolution
        run: cargo test --manifest-path editor/Cargo.toml --locked
      - name: Install the CLI
        run: python -m pip install .
      - name: Verify installed wheel doctor
        shell: bash
        run: |
          cd "${RUNNER_TEMP:-/tmp}"
          ghostless doctor
      - name: Build pinned Rune editor
        run: cargo build --manifest-path editor/Cargo.toml --locked --release
      - name: Exercise the editor session
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SNAP_DIR: ${{ runner.temp }}/ghostless-snaps
        run: |
          mkdir -p "$SNAP_DIR"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python tests/smoke_editor.py --artifacts-dir "$SNAP_DIR/wheel"
          else
            python tests/smoke_editor.py --artifacts-dir "$SNAP_DIR/wheel"
          fi
        shell: bash
      - name: Exercise the editor with the packed npm CLI
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SNAP_DIR: ${{ runner.temp }}/ghostless-snaps
        run: |
          mkdir -p "$SNAP_DIR"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python tests/smoke_editor.py --npm-pack --artifacts-dir "$SNAP_DIR/npm"
          else
            python tests/smoke_editor.py --npm-pack --artifacts-dir "$SNAP_DIR/npm"
          fi
        shell: bash
      - name: Upload editor snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghostless-editor-snapshots-${{ matrix.os }}
          path: ${{ runner.temp }}/ghostless-snaps
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ghostless-editor-${{ matrix.os }}
          path: editor/target/release/${{ matrix.binary }}
          if-no-files-found: error
