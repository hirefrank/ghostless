name: publish

# Publishes on a version tag with npm trusted publishing (OIDC).
# Needs a one-time trusted-publisher entry for the unscoped package ghostless.
# Until that exists the publish step fails and nothing is uploaded.
# See docs/RELEASE.md. Do not add a PyPI publish here.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi

      - name: Run tests
        run: bash tests/run.sh

      - name: Check CLI syntax
        run: bash -n bin/ghostless setup lib/agents.sh

      - name: Publish to npm
        run: npm publish

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it alone."
            exit 0
          fi
          version="${tag#v}"
          notes="$(mktemp)"
          awk -v ver="$version" '
            $0 ~ ("^## v" ver "( |$)") { inside = 1; next }
            inside && /^## v/ { exit }
            inside { print }
          ' CHANGELOG.md > "$notes"
          if [ -s "$notes" ]; then
            gh release create "$tag" --title "$tag" --notes-file "$notes" --latest
          else
            echo "::warning::No CHANGELOG section for $tag; using generated notes"
            gh release create "$tag" --title "$tag" --generate-notes --latest
          fi
